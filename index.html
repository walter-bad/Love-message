<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease-in-out, visibility 1s ease-in-out;
            padding: 20px;
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
            animation: pulse 2s infinite;
        }

        .btn {
            background-color: white;
            color: #ff4b6e;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s, background-color 0.2s;
            margin-top: 20px;
            z-index: 10;
        }

        .btn:hover {
            transform: scale(1.05);
            background-color: #fff0f3;
        }

        /* Falling Emojis Animation */
        .falling-emoji {
            position: absolute;
            top: -50px;
            font-size: 2rem;
            animation: fall linear infinite;
            z-index: 1;
            user-select: none;
        }

        @keyframes fall {
            0% {
                transform: translateY(-50px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Balloons Animation */
        .balloon {
            position: absolute;
            bottom: -100px;
            font-size: 3rem;
            animation: floatUp ease-in infinite;
            z-index: 1;
            user-select: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            50% {
                transform: translateY(-60vh) scale(1.1);
            }
            100% {
                transform: translateY(-120vh) scale(0.9);
                opacity: 0;
            }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Slide 1 -->
    <div class="slide active" id="slide1">
        <h1>Babe, I am so sorry 💔</h1>
        <button class="btn" onclick="goToSlide2()">Next ❤️</button>
    </div>

    <!-- Slide 2 -->
    <div class="slide" id="slide2">
        <h1>I honestly love you so much 💕</h1>
    </div>

    <script>
        function createFallingEmojis() {
            const emojis = ['❤️', '💖', '💘', '💕', '💗', '🌹', '✨'];
            const slide1 = document.getElementById('slide1');
            
            setInterval(() => {
                if (document.getElementById('slide1').classList.contains('active')) {
                    const elem = document.createElement('div');
                    elem.classList.add('falling-emoji');
                    elem.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
                    elem.style.left = Math.random() * window.innerWidth + 'px';
                    elem.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    slide1.appendChild(elem);

                    setTimeout(() => {
                        elem.remove();
                    }, 5000);
                }
            }, 300);
        }

        function createBalloons() {
            const balloonsList = ['🎈', '❤️', '🎈', '💖', '🎈'];
            const slide2 = document.getElementById('slide2');
            
            setInterval(() => {
                if (document.getElementById('slide2').classList.contains('active')) {
                    const elem = document.createElement('div');
                    elem.classList.add('balloon');
                    elem.innerHTML = balloonsList[Math.floor(Math.random() * balloonsList.length)];
                    elem.style.left = Math.random() * window.innerWidth + 'px';
                    elem.style.animationDuration = (Math.random() * 4 + 3) + 's';
                    slide2.appendChild(elem);

                    setTimeout(() => {
                        elem.remove();
                    }, 7000);
                }
            }, 400);
        }

        function goToSlide2() {
            document.getElementById('slide1').classList.remove('active');
            document.getElementById('slide2').classList.add('active');
        }

        createFallingEmojis();
        createBalloons();
    </script>
</body>
</html>
