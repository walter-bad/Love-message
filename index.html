<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irene, You, Me, and Calvin Are Meant to Be!</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #05050a;
        }

        /* Paris Eiffel Tower Background */
        .bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1502602898657-3e91760cbb34?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            filter: brightness(0.65) contrast(1.1);
            z-index: 1;
        }

        /* Romantic Overlay */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(15, 5, 20, 0.4), rgba(50, 10, 35, 0.75));
            z-index: 2;
        }

        /* Message Card */
        .card-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            width: 85%;
            max-width: 460px;
            padding: 35px 25px;
            background: rgba(25, 15, 30, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            border: 2px solid rgba(255, 105, 180, 0.5);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 30px rgba(255, 20, 147, 0.4);
            animation: pulseCard 3s infinite ease-in-out;
        }

        @keyframes pulseCard {
            0%, 100% { border-color: rgba(255, 105, 180, 0.4); box-shadow: 0 20px 40px rgba(0,0,0,0.7), 0 0 25px rgba(255,20,147,0.3); }
            50% { border-color: rgba(255, 20, 147, 0.9); box-shadow: 0 20px 40px rgba(0,0,0,0.7), 0 0 45px rgba(255,20,147,0.7); }
        }

        h1 {
            color: #ffffff;
            font-size: 1.7rem;
            margin-bottom: 15px;
            text-shadow: 0 2px 12px rgba(255, 20, 147, 0.9);
            line-height: 1.4;
        }

        p {
            color: #ffb6c1;
            font-size: 1.2rem;
            margin-bottom: 25px;
            font-weight: 600;
            text-shadow: 0 1px 6px rgba(0,0,0,0.8);
        }

        .btn {
            background: linear-gradient(135deg, #ff1493, #ff69b4);
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 20, 147, 0.5);
            transition: transform 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* BIG Falling Elements (Bubbles & Red Teddy Bears) */
        .falling-item {
            position: absolute;
            top: -70px;
            z-index: 5;
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-70px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0.35;
            }
        }
    </style>
</head>
<body>

    <div class="bg-container"></div>
    <div class="overlay"></div>

    <div class="card-container">
        <h1>Irene, you, I, and Calvin are meant to be! 💕</h1>
        <p>I love you, Irene, in Paris ✨🗼</p>
        <button class="btn" onclick="celebrate()">Forever Together ❤️</button>
    </div>

    <script>
        // BIG Bubbles and BIG Red Teddy Bears
        const elements = ['🧸', '❤️', '🫧', '💖', '🧸', '🎈', '❤️', '🫧'];

        function createFallingItem() {
            const item = document.createElement('div');
            item.classList.add('falling-item');
            item.innerHTML = elements[Math.floor(Math.random() * elements.length)];
            
            // Random horizontal start position across the screen
            item.style.left = Math.random() * 95 + 'vw';
            
            // BIG sizing for the teddy bears and bubbles (between 40px and 70px)
            const size = Math.random() * 30 + 40; 
            item.style.fontSize = size + 'px';
            
            // Random falling speed
            const duration = Math.random() * 4 + 3.5; // between 3.5s and 7.5s
            item.style.animationDuration = duration + 's';
            
            document.body.appendChild(item);

            // Clean up element after it falls
            setTimeout(() => {
                item.remove();
            }, duration * 1000);
        }

        // Generate big items continuously
        setInterval(createFallingItem, 250);

        function celebrate() {
            alert('Paris is magical with you, Irene! Calvin and I love you forever! 🥰💖');
            for(let i = 0; i < 35; i++) {
                setTimeout(createFallingItem, i * 40);
            }
        }
    </script>
</body>
</html>
