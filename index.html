<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zelani, Will You Be My Girlfriend?</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
        }

        /* Eiffel Tower Background */
        .bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1502602898657-3e91760cbb34?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            filter: brightness(0.6) contrast(1.1);
            z-index: 1;
        }

        /* Dark overlay for romance */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(11, 15, 25, 0.4), rgba(40, 10, 30, 0.7));
            z-index: 2;
        }

        /* Message Card */
        .card-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            width: 85%;
            max-width: 450px;
            padding: 30px 20px;
            background: rgba(20, 15, 25, 0.75);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            border: 2px solid rgba(255, 105, 180, 0.4);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 25px rgba(255, 20, 147, 0.3);
            animation: pulseCard 3s infinite ease-in-out;
        }

        @keyframes pulseCard {
            0%, 100% { border-color: rgba(255, 105, 180, 0.4); box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 20px rgba(255,20,147,0.3); }
            50% { border-color: rgba(255, 20, 147, 0.8); box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 40px rgba(255,20,147,0.6); }
        }

        h1 {
            color: #ffffff;
            font-size: 1.8rem;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(255, 20, 147, 0.8);
            line-height: 1.4;
        }

        p {
            color: #ffb6c1;
            font-size: 1.1rem;
            margin-bottom: 25px;
            font-weight: 500;
            text-shadow: 0 1px 5px rgba(0,0,0,0.8);
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            background: linear-gradient(135deg, #ff1493, #ff69b4);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 20, 147, 0.4);
            transition: transform 0.2s, background 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-no {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Falling Elements (Bubbles & Bears) */
        .falling-item {
            position: absolute;
            top: -50px;
            z-index: 5;
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-50px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0.3;
            }
        }
    </style>
</head>
<body>

    <div class="bg-container"></div>
    <div class="overlay"></div>

    <div class="card-container">
        <h1>Zelani, will you be my girlfriend? 💕</h1>
        <p>Will you take Walter as your Man? ✨</p>
        <div class="btn-group">
            <button class="btn" onclick="celebrate()">Yes! ❤️</button>
            <button class="btn btn-no" onclick="moveButton(this)">No</button>
        </div>
    </div>

    <script>
        // Array of elements to fall (Love bubbles & Red Teddy Bears)
        const elements = ['🧸', '❤️', '🫧', '💖', '🧸', '🎈', '❤️', '🫧'];

        function createFallingItem() {
            const item = document.createElement('div');
            item.classList.add('falling-item');
            item.innerHTML = elements[Math.floor(Math.random() * elements.length)];
            
            // Random horizontal start position
            item.style.left = Math.random() * 100 + 'vw';
            
            // Random size for variety
            const size = Math.random() * 20 + 20; // between 20px and 40px
            item.style.fontSize = size + 'px';
            
            // Random fall duration (speed)
            const duration = Math.random() * 4 + 3; // between 3s and 7s
            item.style.animationDuration = duration + 's';
            
            document.body.appendChild(item);

            // Clean up element after it falls off screen
            setTimeout(() => {
                item.remove();
            }, duration * 1000);
        }

        // Generate falling items continuously
        setInterval(createFallingItem, 300);

        // Fun interaction for the "No" button
        function moveButton(btn) {
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function celebrate() {
            alert('Yay!! ❤️ Welcome to Walter’s heart, Zelani! 🥰');
            for(let i = 0; i < 30; i++) {
                setTimeout(createFallingItem, i * 50);
            }
        }
    </script>
</body>
</html>
