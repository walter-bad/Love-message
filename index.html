<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Message for You</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
        }

        /* Background Paris Clouds Setting */
        .scene {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #1a1c29, #382845, #5b3256);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Simulated Paris Silhouette / Atmosphere layer */
        .paris-skyline {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40%;
            background: url('https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=1950&q=80') no-repeat bottom center;
            background-size: cover;
            opacity: 0.25;
            filter: brightness(0.6);
            z-index: 1;
        }

        /* Clouds overlay */
        .clouds {
            position: absolute;
            width: 200%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(0,0,0,0) 70%);
            animation: drift 30s linear infinite;
            z-index: 2;
            pointer-events: none;
        }

        @keyframes drift {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(0%); }
        }

        /* Sparks Canvas */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        /* Central Message Box */
        .message-container {
            position: relative;
            z-index: 4;
            text-align: center;
            padding: 20px;
            animation: fadeIn 3s ease-in-out;
        }

        h1 {
            color: #fff;
            font-size: clamp(2rem, 5vw, 4.5rem);
            font-weight: 300;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(255, 105, 180, 0.8), 0 0 40px rgba(255, 105, 180, 0.4);
            margin-bottom: 10px;
        }

        .heart {
            display: inline-block;
            color: #ff3366;
            animation: pulse 1.5s infinite;
            text-shadow: 0 0 25px rgba(255, 51, 102, 0.8);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="paris-skyline"></div>
        <div class="clouds"></div>
        <canvas id="sparksCanvas"></canvas>

        <div class="message-container">
            <h1>I Love You <span class="heart">❤️</span></h1>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('sparksCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const sparks = [];
        const numSparks = 70;

        class Spark {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.5 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.8;
                this.speedY = -Math.random() * 1.5 - 0.5; // Floating upwards like sparks in clouds
                this.opacity = Math.random();
                this.fadeSpeed = Math.random() * 0.02 + 0.005;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.opacity -= this.fadeSpeed;

                if (this.y < 0 || this.opacity <= 0) {
                    this.reset();
                    this.y = canvas.height + 10;
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = '#ffeb99'; // Golden spark glow
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff99cc';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < numSparks; i++) {
            sparks.push(new Spark());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            sparks.forEach(spark => {
                spark.update();
                spark.draw();
            });
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
